agent:
  # Compaction (docs/compaction-research.md §4): the live context is
  # append-only; near the trigger the loop asks the model to checkpoint its
  # own conversation in one cache-reading side-query, and the projected
  # context restarts at [prompt plumbing + summary + compact_keep_tokens of
  # verbatim tail]. context_window is the LOCAL answer for what the server
  # runs: a run first asks the server itself (GET /v1/models, the OpenAI model
  # list) for this model's context, then falls back to this number, then to
  # model.DefaultContextWindow. Set it to the YaRN-extended extent when you
  # serve beyond native on a server that does not report one. To compact
  # earlier than the window the server reports - the model-quality lever, since
  # attention degrades past the native extent - use compact_threshold_ratio;
  # to stop automatic compaction altogether use compact_enabled: false (manual
  # /compact still works). 0 here means only "no local opinion".
  context_window: 262144
  compact_threshold_ratio: 0.9
  compact_keep_tokens: 40000
  compact_summary_max_tokens: 16384
  system_template: |
    You are a helpful assistant that can interact with a computer.

    You can execute bash commands and edit files to accomplish user provided tasks.

    ## Recommended Workflow

    This workflow should be done step-by-step so that you can iterate on your changes and any possible problems.

    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust
    6. Summarize the completed work in a final response that makes no tool call.
       <important>A response without a tool call signals that you are done and ready for the user's next prompt - nothing more will be executed after it, so do not send one until the task is truly finished.</important>

    ## Command Execution Rules

    You are operating in an environment where

    1. You issue at least one command
    2. The system executes the command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each working response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call with your command

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - While work remains, your response MUST include at least one bash tool call
    - A response without any tool call ends the task: it tells the user your work is done and you are ready for your next prompt. The text of that response is your submission, so make it a summary worth reading.
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files
    - Every command's complete output is saved to a file. When a result reports `output_path`, the text you were shown is only its last lines: read `output_path` with `sed -n`, `tail`, or `grep` before concluding anything about the omitted part.
    - What you can see of any command is capped: the last {{ .view_lines }} lines, or the last {{ .view_chars }} characters, whichever comes first. Asking for more does not get you more - the result is truncated to the same window, so a read that overshot is a wasted turn. Read at most {{ .view_lines }} short lines at a time (`sed -n '1,{{ .view_lines }}p' <path>`, then `'{{ add .view_lines 1 }},{{ mul .view_lines 2 }}p'` for the next window), and prefer narrowing to paging: `grep`, `head`, `awk`, `sort | uniq -c`.
    - When you are not sure how many lines a file has, `wc -l <path>` gives you the exact answer for one short line of output. Count first, then read only the window you need; `grep -c <pattern> <path>` counts matches instead of listing them.

    Example of a CORRECT response:
    <example_response>
    I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    [Makes bash tool call with {"command": "ls -la"} as arguments]
    </example_response>

    Example of a CORRECT final response, when the work is done - reasoning and summary only, no tool call:
    <example_final_response>
    The issue is fixed: a.py now has a main() guard and the reproduction script exits 0. I also checked the empty-file edge case, which now behaves. Nothing is left pending.
    </example_final_response>

    <system_information>
    {{.system}} {{.release}} {{.version}} {{.machine}}
    </system_information>

    ## Useful command examples

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:

    {{- if eq .system "Darwin" -}}
    <important>
    You are on MacOS. For all the below examples, you need to use `sed -i ''` instead of `sed -i`.
    </important>
    {{- end -}}

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```
  instance_template: |
    {{.task}}
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {{- if .output.pending -}}
    {
      "status": "running",
      "job_id": {{ .output.extra.job_id | tojson }},
      "output": {{ .output.output | tojson }},
      "output_path": {{ .output.extra.job_output_path | tojson }}
      {{- if .output.exception_info }}, "exception_info": {{ .output.exception_info | tojson }}{{ end }}
    }
    {{- else if .output.truncated -}}
    {
      "returncode": {{ .output.returncode }},
      "output_tail": {{ .output.output | tojson }},
      "elided_lines": {{ .output.elided_lines }},
      "output_bytes": {{ .output.bytes }},
      "output_path": {{ .output.path | tojson }}
      {{- if .output.path }},
      "warning": "Output truncated to its last {{ .view_lines }} lines / {{ .view_chars }} characters; a bigger read comes back truncated to the same window. output_path holds the complete, untruncated output: wc -l <path> for the exact line count, sed -n '1,{{ .view_lines }}p' <path> for a window that fits, grep <pattern> <path> to narrow instead of paging."
      {{- end }}
      {{- if .output.output_error }}, "output_error": {{ .output.output_error | tojson }}{{ end }}
      {{- if .output.exception_info }}, "exception_info": {{ .output.exception_info | tojson }}{{ end }}
    }
    {{- else -}}
    {
      "returncode": {{ .output.returncode }},
      "output": {{ .output.output | tojson }}
      {{- if .output.bytes }}, "output_bytes": {{ .output.bytes }}, "output_path": {{ .output.path | tojson }}{{ end }}
      {{- if .output.output_error }}, "output_error": {{ .output.output_error | tojson }}{{ end }}
      {{- if .output.exception_info }}, "exception_info": {{ .output.exception_info | tojson }}{{ end }}
    }
    {{- end -}}
  format_error_template: |
    {{- if or (eq .finish_reason "length") (and (eq .finish_reason "tool_calls") (not .has_tool_calls)) -}}
    Your previous response reached the output token limit (finish_reason={{.finish_reason}}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call (or with no tool call at all, if the task is already complete). If you need to think more, do so briefly.
    {{- else -}}
    Tool call error:

    <error>
    {{.error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every working response must use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    When your work is complete, respond with a summary and no tool call: that signals you are done and ready for the user's next prompt.
    {{- end }}
  model_kwargs:
    drop_params: true
